<style>
        body {
            background-color: #000000;
            color: #ffffff;
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .input-focus-glow:focus {
            outline: none;
            border-color: #ffffff;
            box-shadow: 0 4px 20px -10px rgba(255, 255, 255, 0.2);
        }
        .continue-btn-active:active {
            transform: scale(0.98);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-body-lg text-body-lg flex flex-col min-h-screen">
<!-- Top Navigation (Shell suppressed for Onboarding) -->
<header class="h-20 flex items-center px-6">
<button class="p-2 -ml-2 text-on-surface-variant hover:text-primary transition-colors" onclick="window.history.back()">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col px-6 pt-12 max-w-[500px] mx-auto w-full">
<!-- Animated Background Element (Subtle atmosphere) -->
<div class="fixed inset-0 pointer-events-none opacity-20">
<div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] rounded-full bg-gradient-to-br from-primary/10 to-transparent blur-[120px]"></div>
</div>
<!-- Header Section -->
<div class="space-y-4 mb-xl">
<h1 class="font-display-lg-mobile text-display-lg-mobile text-primary tracking-tight">
                What is your name?
            </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-[280px]">
                We use your name to personalize your performance dashboard.
            </p>
</div>
<!-- Input Field Section -->
<div class="relative group mt-12">
<input autocomplete="off" class="w-full bg-transparent border-t-0 border-x-0 border-b border-outline-variant py-4 font-headline-md text-headline-md text-primary placeholder:text-surface-variant focus:ring-0 focus:border-primary transition-all duration-300 input-focus-glow" id="nameInput" placeholder="e.g., Abdimalik" type="text"/>
<div class="absolute bottom-0 left-0 h-[1px] w-0 bg-primary transition-all duration-500 group-focus-within:w-full"></div>
</div>
<!-- Progress Indicator (Subtle) -->
<div class="mt-xl flex gap-1">
<div class="h-1 w-8 bg-primary rounded-full"></div>
<div class="h-1 w-8 bg-surface-container-highest rounded-full"></div>
<div class="h-1 w-8 bg-surface-container-highest rounded-full"></div>
</div>
</main>
<!-- Fixed Bottom Action Area -->
<footer class="p-6 pb-12 max-w-[500px] mx-auto w-full">
<button class="w-full h-14 bg-primary text-background font-headline-sm text-headline-sm rounded-lg continue-btn-active transition-all flex items-center justify-center gap-2 hover:opacity-90 disabled:opacity-30 disabled:cursor-not-allowed" disabled="" id="continueBtn">
            Continue
            <span class="material-symbols-outlined">arrow_forward</span>
</button>
</footer>
<script>
        // Simple micro-interaction for button state
        const nameInput = document.getElementById('nameInput');
        const continueBtn = document.getElementById('continueBtn');

        nameInput.addEventListener('input', (e) => {
            const value = e.target.value.trim();
            if (value.length > 1) {
                continueBtn.disabled = false;
                continueBtn.classList.remove('opacity-30');
            } else {
                continueBtn.disabled = true;
                continueBtn.classList.add('opacity-30');
            }
        });

        // Trigger focus on load for mobile experience
        window.onload = () => {
            nameInput.focus();
        };

        // Handle navigation
        continueBtn.addEventListener('click', () => {
            if(!continueBtn.disabled) {
                // Animation transition could go here
                console.log('Navigating to next screen...');
            }
        });
    </script>
</body></html>
