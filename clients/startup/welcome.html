<!DOCTYPE html>
<html lang="en">
<head>
    <!-- ===============================
         META DATA
    ================================ -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Growth OS | Welcome</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/startup/welcome.css">
    <link rel="stylesheet" href="../css/startup/onboarding.css">
</head>

<body>

    <!-- =====================================
         WELCOME PAGE
    ====================================== -->
    <main class="startpage">
        <!-- ===============================
             HEADER
        ================================ -->
        <header class="welcome-header">
            <div class="brand">
                <img
                    src="../assets/icons/unnamed.png"
                    alt="Growth OS Logo"
                    class="brand-logo">
                <span class="brand-name">
                    Growth OS
                </span>
            </div>
        </header>
        <!-- ==============================
             HERO SECTION
        ================================ -->
        <section class="hero">
            <div class="hero-content">
                <h1 class="hero-title">
                Build Your Best Self
            </h1>
                <p class="hero-description">
                    Develop better habits, improve your focus,
                    and become the person you want to be,
                     one intentional day at a time.
                </p>
            </div>
        </section>
        <!-- ===============================
             JOURNEY ILLUSTRATION
        ================================ -->

        <section class="welcome-illustration">
            <!-- Placeholder for now -->
            <div class="growth-path">
                <span class="dot active"></span>
                <span class="line"></span>
                <span class="dot"></span>
                <span class="line"></span>
                <span class="dot"></span>
                <span class="line"></span>
                <span class="dot"></span>
                <span class="line"></span>
                <span class="dot"></span>
                <span class="line"></span>
                <span class="material-symbols-outlined star">
                    star
                </span>
            </div>
        </section>


        <!-- ===============================
             ACTION SECTION
        ================================ -->
        <section class="welcome-actions">
            <button
                class="btn btn-white cta-btn"
                id="startButton">
                <span>
                    Begin Journey
                </span>
                <span class="material-symbols-outlined cta-arrow">
                    arrow_forward
                </span>
            </button>
            <p class="helper-text">
                Takes less than 2 minutes
            </p>
        </section>
    </main>
    <!-- ===============================
         JAVASCRIPT
    ================================ -->
    <script src="../js/storage.js"></script>
    <script src="../js/onboarding.js"></script>

</body>
</html>
</body>
</html>
