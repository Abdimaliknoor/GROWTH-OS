<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#131313" />
    <title>Your name | Growth OS</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" href="../assets/icons/unnamed.png" />

    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/startup/onboarding.css" />
    <link rel="stylesheet" href="../css/startup/name.css" />
  </head>
  <!-- ╔══════════════════════════════════════════════════════════════╗
     ║  NAME  ·  startup/name.html                                  ║
     ║  One question before the 4 steps: what should we call you?   ║
     ╚══════════════════════════════════════════════════════════════╝
     Saves with saveName() → identity.html (Step 01: Direction). -->
  <body>
    <div class="ob-page">
      <header class="ob-topbar">
        <span class="ob-brand">
          <span class="ob-brand-mark icon" aria-hidden="true">north_east</span>
          Growth OS
        </span>
      </header>

      <main class="ob-content">
        <form id="nameForm" novalidate>
          <h1 class="ob-title">What should we call you?</h1>
          <p class="ob-subtitle">
            Your first name is enough. It's how Today says good morning.
          </p>

          <label class="ob-label name-label" for="nameInput">Your name</label>
          <input
            class="ob-input name-input"
            id="nameInput"
            type="text"
            maxlength="30"
            placeholder="e.g. Amina"
            autocomplete="given-name"
            autocapitalize="words"
            enterkeyhint="next"
          />

          <!-- A live preview: the user sees their name in the app before they start -->
          <p class="name-preview" id="namePreview" aria-live="polite" hidden>
            Good morning, <strong id="namePreviewText"></strong>.
          </p>
        </form>
      </main>

      <footer class="ob-footer">
        <a class="ob-btn ob-btn-secondary" href="welcome.html">Back</a>
        <button
          class="ob-btn ob-btn-primary"
          id="continueButton"
          type="submit"
          form="nameForm"
          disabled
        >
          Continue
          <span class="icon" aria-hidden="true">arrow_forward</span>
        </button>
      </footer>
    </div>

    <!-- storage → state → this page -->
    <script src="../js/data/storage.js"></script>
    <script src="../js/data/state.js"></script>
    <script src="../js/onboardingPages/name.js"></script>
  </body>
</html>
