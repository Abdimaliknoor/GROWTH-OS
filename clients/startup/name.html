<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your name | Growth OS</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/startup/onboarding.css" />
    <link rel="stylesheet" href="../css/startup/name.css" />
  </head>
  <body>
    <div class="ob-page">
      <header class="ob-topbar">
        <span class="ob-brand">
          <span class="ob-brand-mark icon" aria-hidden="true">north_east</span>
          Growth OS
        </span>
      </header>

      <main class="ob-content">
        <p class="ob-eyebrow">Let's begin</p>
        <h1 class="ob-title">What should we call you?</h1>
        <p class="ob-subtitle">
          We'll use your name throughout your Growth OS journey.
        </p>

        <form class="name-form" id="nameForm" novalidate>
          <label class="visually-hidden" for="nameInput">Your name</label>
          <input
            class="name-input"
            id="nameInput"
            type="text"
            placeholder="Your name"
            autocomplete="given-name"
            maxlength="40"
            aria-describedby="nameHint nameError"
          />
          <p class="ob-hint" id="nameHint">First name is fine.</p>
          <p class="ob-error" id="nameError" role="alert" hidden></p>
        </form>
      </main>

      <footer class="ob-footer">
        <a class="ob-btn ob-btn-secondary" href="welcome.html">Back</a>
        <button
          class="ob-btn ob-btn-primary"
          id="continueButton"
          type="submit"
          form="nameForm"
          disabled
        >
          Continue
          <span class="icon" aria-hidden="true">arrow_forward</span>
        </button>
      </footer>
    </div>

    <script src="../js/state.js"></script>
    <script src="../js/onboardingPages/name.js"></script>
  </body>
</html>
