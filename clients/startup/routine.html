<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Routine | Growth OS</title>
    <link rel="icon" type="image/png" href="./assets/icons/unnamed.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />

    <!-- Order matters: base (tokens) → onboarding (shared shell) → this page -->
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/startup/onboarding.css" />
    <link rel="stylesheet" href="../css/startup/routine.css" />
  </head>
  <body>
    <div class="ob-page">
      <header class="ob-topbar">
        <span class="ob-brand">
          <span class="ob-brand-mark icon" aria-hidden="true">north_east</span>
          Growth OS
        </span>
        <p class="ob-step">Step 04 of 04</p>
      </header>

      <nav class="ob-progress" aria-label="Onboarding progress">
        <ol>
          <li class="is-done">Direction</li>
          <li class="is-done">Goal</li>
          <li class="is-done">Habit</li>
          <li class="is-current" aria-current="step">Routine</li>
        </ol>
      </nav>

      <main class="ob-content ob-content-top">
        <!-- The habits being scheduled: Habits → Routine.
                 routine.js fills the empty spans. -->
        <div class="chain-card">
          <span class="icon chain-icon" aria-hidden="true">checklist</span>
          <div class="chain-text">
            <span class="chain-label"
              >Habits · <span id="goalTitle"></span
            ></span>
            <span class="chain-value" id="habitNames"></span>
          </div>
          <a class="chain-edit" href="habit.html">Edit</a>
        </div>
        <div class="chain-line" aria-hidden="true"></div>

        <h1 class="ob-title">Give your habits a place in your day</h1>
        <p class="ob-subtitle">
          A habit tells you what to do. A routine tells you when.
        </p>

        <!-- One card per item to schedule: Wake up, each habit, Sleep.
                 Built by routine.js from the habits you saved. -->
        <div class="plan-list" id="planList"></div>

        <!-- What's still missing, in one sentence -->
        <p class="routine-status" id="routineStatus" role="status"></p>

        <!-- ============ PREVIEW: YOUR DAY ============ -->
        <section class="day-preview" aria-labelledby="previewTitle">
          <h2 class="ob-eyebrow" id="previewTitle">Your day</h2>

          <!-- Pick which day to preview. Buttons with aria-pressed:
                     a screen reader says "Monday, pressed". -->
          <div
            class="preview-days"
            id="previewDays"
            aria-label="Day to preview"
          ></div>

          <ol class="timeline" id="timeline"></ol>
        </section>
      </main>

      <footer class="ob-footer">
        <a class="ob-btn ob-btn-secondary" href="habit.html">Back</a>
        <button
          class="ob-btn ob-btn-primary"
          id="finishButton"
          type="button"
          disabled
        >
          Finish setup
          <span class="icon" aria-hidden="true">check</span>
        </button>
      </footer>
    </div>

    <!-- Order matters: state.js defines the functions routine.js uses -->
    <script src="../js//data/storage.js"></script>
    <script src="../js//data/state.js"></script>
    <script src="../js/onboardingPages/routine.js"></script>
  </body>
</html>
