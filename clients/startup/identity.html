<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#131313" />
    <title>Direction | Growth OS</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" href="../assets/icons/unnamed.png" />

    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/startup/onboarding.css" />
    <link rel="stylesheet" href="../css/startup/identity.css" />
  </head>
  <!-- ╔══════════════════════════════════════════════════════════════╗
     ║  DIRECTION  ·  startup/identity.html  (Step 01 of 04)        ║
     ║  Two questions: which part of life? who do you want to be?   ║
     ╚══════════════════════════════════════════════════════════════╝
     MAP
       1. Area cards      ← drawn from AREAS (areas.js)
       2. Identity list   ← appears after an area is picked
       3. Footer          Back → name.html · Continue → goal.html
     Saves with saveDirection({ area, areaLabel, identity }). -->
  <body>
    <div class="ob-page">
      <header class="ob-topbar">
        <span class="ob-brand">
          <span class="ob-brand-mark icon" aria-hidden="true">north_east</span>
          Growth OS
        </span>
        <p class="ob-step">Step 01 of 04</p>
      </header>

      <nav class="ob-progress" aria-label="Onboarding progress">
        <ol>
          <li class="is-current" aria-current="step">Direction</li>
          <li>Goal</li>
          <li>Habit</li>
          <li>Routine</li>
        </ol>
      </nav>

      <main class="ob-content ob-content-top">
        <form id="directionForm" novalidate>
          <h1 class="ob-title">
            <span id="greeting">Hi</span>. Where do you want to grow?
          </h1>
          <p class="ob-subtitle">
            Pick one part of your life to start with. You can add more later.
          </p>

          <!-- ═══════════ 1. AREA CARDS ═══════════ -->
          <fieldset class="dir-fieldset">
            <legend class="visually-hidden">Area of life</legend>
            <div class="area-grid" id="areaGrid"></div>
          </fieldset>

          <!-- ═══════════ 2. IDENTITY ═══════════ -->
          <fieldset
            class="dir-fieldset identity-block"
            id="identityBlock"
            hidden
          >
            <legend class="ob-label identity-legend">I am…</legend>
            <p class="ob-hint identity-hint">
              Pick the person you want to become. Your goal and habits will
              follow from this.
            </p>

            <div class="identity-list" id="identityList"></div>

            <!-- Shown when "Write my own" is picked (or the area has no suggestions) -->
            <div class="identity-own" id="identityOwn" hidden>
              <label class="visually-hidden" for="identityInput"
                >Write who you want to become</label
              >
              <input
                class="ob-input"
                id="identityInput"
                type="text"
                maxlength="80"
                placeholder="e.g. Someone who reads every night"
                autocomplete="off"
              />
            </div>
          </fieldset>
        </form>
      </main>

      <footer class="ob-footer">
        <a class="ob-btn ob-btn-secondary" href="name.html">Back</a>
        <button
          class="ob-btn ob-btn-primary"
          id="continueButton"
          type="submit"
          form="directionForm"
          disabled
        >
          Continue
          <span class="icon" aria-hidden="true">arrow_forward</span>
        </button>
      </footer>
    </div>

    <!-- ═══════════ TEMPLATES (copied by direction.js) ═══════════ -->
    <template id="areaTemplate">
      <label class="area-card">
        <input class="visually-hidden" type="radio" name="area" />
        <span class="icon area-icon" aria-hidden="true"></span>
        <span class="area-name"></span>
      </label>
    </template>

    <template id="identityTemplate">
      <label class="identity-option">
        <input class="visually-hidden" type="radio" name="identity" />
        <span class="identity-text"></span>
      </label>
    </template>

    <!-- storage → state → areas → this page -->
    <script src="../js/data/storage.js"></script>
    <script src="../js/data/state.js"></script>
    <script src="../js/data/sync.js"></script>
    <script src="../js/onboardingPages/areas.js"></script>
    <script src="../js/onboardingPages/direction.js"></script>
  </body>
</html>
